[package]
name = "konomanoasa-tree-sitter-zsh"
version = "0.4.1"
edition = "2024"
description = "Tree-sitter grammars for zsh."
readme = "README.md"
repository = "https://github.com/konomanoasa/tree-sitter-zsh"
license = "MIT"
build = "bindings/rust/build.rs"
links = "tree-sitter-zsh"
include = [
  "/LICENSE",
  "/PARSING_POLICY.md",
  "/README.md",
  "/bindings/rust/*.rs",
  "/common/*.h",
  "/queries/*.scm",
  "/src/*.c",
  "/src/*.h",
  "/src/node-types.json",
  "/src/tree_sitter/*.h",
  "/test/bindings.test.rs",
  "/zsh_extended_glob/src/*.c",
  "/zsh_extended_glob/src/*.h",
  "/zsh_extended_glob/src/node-types.json",
  "/zsh_extended_glob/src/tree_sitter/*.h",
]

[lib]
path = "bindings/rust/lib.rs"

[[test]]
name = "bindings"
path = "test/bindings.test.rs"

[dependencies]
tree-sitter-language = "=0.1.9"

[dev-dependencies]
tree-sitter = "=0.27.1"

[build-dependencies]
cc = "=1.10.0"
